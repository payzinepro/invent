<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Inventory Management System</h1>
            <p>Manage your products and stock</p>
        </header>

        <!-- Dashboard -->
        <section class="dashboard">
            <div class="card">
                <h3>Total Products</h3>
                <p id="totalProducts">0</p>
            </div>

            <div class="card">
                <h3>Total Stock</h3>
                <p id="totalStock">0</p>
            </div>

            <div class="card">
                <h3>Low Stock</h3>
                <p id="lowStock">0</p>
            </div>

            <div class="card">
                <h3>Inventory Value</h3>
                <p id="inventoryValue">0 Frw</p>
            </div>
        </section>

        <!-- Add Product -->
        <section class="form-section">
            <h2>Add Product</h2>

            <form id="productForm">

                <input
                    type="text"
                    id="productName"
                    placeholder="Product Name"
                    required
                >

                <input
                    type="text"
                    id="sku"
                    placeholder="SKU / Product Code"
                    required
                >

                <input
                    type="text"
                    id="category"
                    placeholder="Category"
                    required
                >

                <input
                    type="number"
                    id="quantity"
                    placeholder="Quantity"
                    min="0"
                    required
                >

                <input
                    type="number"
                    id="price"
                    placeholder="Price (Frw)"
                    min="0"
                    required
                >

                <button type="submit">Add Product</button>

            </form>
        </section>

        <!-- Search -->
        <section class="inventory-section">

            <div class="inventory-header">
                <h2>Inventory</h2>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search products..."
                >
            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>SKU</th>
                            <th>Category</th>
                            <th>Quantity</th>
                            <th>Price</th>
                            <th>Value</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="productTable">
                        <!-- Products will appear here -->
                    </tbody>

                </table>

            </div>

        </section>

    </div>

    <!-- Firebase -->
    <script type="module" src="app.js"></script>

</body>
</html>
